name: Semantic Validation

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  semantic-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Semantic Tests
        run: npm run test:semantic

      - name: Report Tests
        run: npm run test:reports

