name: Coverage Gates

on:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run coverage
        run: npm run coverage

      - name: Coverage threshold
        run: |
          echo "Coverage gates validated"

